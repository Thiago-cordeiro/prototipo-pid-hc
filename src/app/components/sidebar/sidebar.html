<header class="mobile-header">
  <a class="mobile-header__brand" routerLink="/" (click)="close()">PID-HC</a>

  <button
    class="mobile-header__menu-button"
    type="button"
    aria-label="Abrir menu principal"
    aria-controls="main-sidebar"
    [attr.aria-expanded]="isOpen()"
    (click)="open()"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 6h16M4 12h16M4 18h16" />
    </svg>
  </button>
</header>

<aside id="main-sidebar" class="sidebar" [class.sidebar--open]="isOpen()">
  <header class="sidebar__mobile-header">
    <h2 class="sidebar__mobile-title">PID-HC</h2>

    <button class="sidebar__close" type="button" aria-label="Fechar menu" (click)="close()">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m6 6 12 12M18 6 6 18" />
      </svg>
    </button>
  </header>

  <div class="sidebar__body">
    <header class="sidebar__header">
      <a class="sidebar__brand" routerLink="/" (click)="close()">PID-HC</a>
    </header>

    <nav class="sidebar__nav" aria-label="Menu principal">
      <span class="sidebar__section-title">Menu</span>

      <a
        class="sidebar__link"
        routerLink="/materiais"
        routerLinkActive="sidebar__link--active"
        (click)="close()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 13v4M15 5v4M3 3v16a2 2 0 0 0 2 2h16" />
          <rect x="7" y="13" width="9" height="4" rx="1" />
          <rect x="7" y="5" width="12" height="4" rx="1" />
        </svg>
        <span>Materiais</span>
      </a>

      <a
        class="sidebar__link"
        routerLink="/historico-materiais"
        routerLinkActive="sidebar__link--active"
        (click)="close()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
          <path d="M3 3v5h5M12 7v5l3 2" />
        </svg>
        <span>Histórico de materiais</span>
      </a>

      <a
        class="sidebar__link"
        routerLink="/tecnovigilancia"
        routerLinkActive="sidebar__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="close()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
          <path
            d="M3 10a2 2 0 0 1 .71-1.53l7-6a2 2 0 0 1 2.58 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"
          />
        </svg>
        <span>Tecnovigilância</span>
      </a>

      <a
        class="sidebar__link"
        routerLink="/tecnovigilancia/importar"
        routerLinkActive="sidebar__link--active"
        (click)="close()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v12" />
          <path d="m7 10 5 5 5-5" />
          <path d="M5 21h14a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2" />
        </svg>
        <span>Importar planilha</span>
      </a>
    </nav>

    <footer class="sidebar__footer">
      <div class="sidebar__user">
        <span class="sidebar__avatar" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21a8 8 0 0 1 16 0" />
          </svg>
        </span>

        <span class="sidebar__user-data">
          <small>administrador</small>
          <strong>Usuário</strong>
        </span>
      </div>

      <button class="sidebar__logout" type="button" aria-label="Sair do sistema">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M10 17l5-5-5-5M15 12H3" />
          <path d="M14 3h5a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-5" />
        </svg>
        <span>Sair</span>
      </button>
    </footer>
  </div>
</aside>

<button
  class="sidebar-backdrop"
  type="button"
  tabindex="-1"
  aria-label="Fechar menu"
  [class.sidebar-backdrop--visible]="isOpen()"
  (click)="close()"
></button>
